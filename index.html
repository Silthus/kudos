<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1f27" media="(prefers-color-scheme: dark)" />
    <script>
      // Pre-paint theme (prototype #54): no flash of the wrong theme.
      (function () { var p = localStorage.getItem("kudos.theme"); var d = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.dataset.theme = d ? "dark" : "light"; })();
    </script>
    <meta name="description" content="Kudos: peer recognition for Slack with daily allowances, collectible bot messages, leaderboards and analytics." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌮</text></svg>" />
    <title>Kudos · Recognition for Slack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
