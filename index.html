<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1f27" media="(prefers-color-scheme: dark)" />
    <script id="theme-prepaint">
      // Paint the saved theme before anything renders (no flash). Mirrors resolveTheme in src/lib/theme.ts.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("kudos.theme"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <meta name="description" content="Kudos: peer recognition for Slack with daily allowances, collectible bot messages, leaderboards and analytics." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kudos · Recognition for Slack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
