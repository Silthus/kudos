name: Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    uses: ./.github/workflows/gate-suite.yml

  # The one check a pull request waits for: it runs even when part of the suite failed, so it reads red rather than skipped.
  gate:
    needs: suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$SUITE" = success
        env:
          SUITE: ${{ needs.suite.result }}

  # The sign-in handshake drives Convex Auth against a mock Slack issuer on a disposable local backend the test starts itself.
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:handshake

  # The outside-in E2E suite drives the app on a disposable local backend through signed Slack requests, a Slack fake and a browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec e2e-web install chromium --with-deps

      # The journeys tagged @time move the local app's clock with libfaketime.
      - run: sudo apt-get install -y faketime

      # Once every journey passes, the data they left is exported as the move exports it: the rewrite's load is proven on
      # that export, kept as e2e/rewrite/oracleExport.zip, which a green run's artifact refreshes.
      - run: pnpm e2e
        env:
          E2E_EXPORT_TO: ${{ runner.temp }}/oracleExport.zip

      # Trimmed before it is uploaded, so the artifact never holds the company directory, which names real people.
      - run: node e2e/local/trimExport.ts "$RUNNER_TEMP/oracleExport.zip" "$RUNNER_TEMP/oracleExport.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-export
          path: ${{ runner.temp }}/oracleExport.zip
          if-no-files-found: error
          retention-days: 1

  # The rewrite on a throwaway Postgres 18, behind a stand-in for the hosting edge, through the journeys on its supported
  # list (e2e/rewrite/supported.txt). The e2e tool's web engine starts a browser whatever the journeys use.
  e2e-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec e2e-web install chromium --with-deps

      - run: pnpm e2e:rewrite
