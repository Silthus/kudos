# Every Gate run that passes on main deploys its commit to the production Convex deployment; the Gate is the deploy's gate, so each merge runs the suite once.
# The deploy key is scoped to that one deployment and reaches only the steps that deploy, upload the website, prepare its flag, read the faces and backfill the pending-crate index.
name: Deploy production

on:
  workflow_run:
    workflows: [Gate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer Gate's deploy waits for the running deploy, then the newest one wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Main's tip as it stands when this run starts. A Gate that did not pass deploys nothing, and the deploy job deploys the Gate's commit only while it is still the tip:
  # a newer merge's own Gate deploys the newer commit, a merge whose push fired no Gate is deployed by the next merge's, and a rerun of an older Gate never rolls production back.
  tip:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - id: tip
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tip
    if: ${{ needs.tip.outputs.sha == github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tip.outputs.sha }}
          persist-credentials: false

      # Re-running only the failed jobs keeps the first attempt's commit: it deploys only while that commit is still the branch's tip, so a rerun never rolls the deployment back.
      - name: Refuse an earlier attempt's commit once the branch moved on
        if: ${{ needs.tip.outputs.attempt != github.run_attempt }}
        run: |
          refs=$(git ls-remote --exit-code origin "$GITHUB_REF")
          tip=$(awk -v ref="$GITHUB_REF" '$2 == ref { print $1 }' <<< "$refs")
          test "$tip" = "$SHA" || { echo "::error::$GITHUB_REF moved from $SHA to $tip since the first attempt, and this rerun may have replaced a newer run waiting to deploy; re-run all jobs to gate and deploy the tip"; exit 1; }
        env:
          SHA: ${{ needs.tip.outputs.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - name: Deploy to the production deployment
        id: deploy
        run: pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PRODUCTION }}

      # The website is built against this deployment's own URL, then served by its static hosting.
      - name: Build the website and upload it to the production deployment
        run: pnpm exec static-hosting upload --build --build-command "pnpm website:build" --dist website/dist
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PRODUCTION }}

      # The website flag's query path finds only an existing workspace key, so every deploy makes sure it exists.
      - name: Prepare the website flag's workspace key
        run: pnpm exec convex run website/flag:prepareWebsiteFlag
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PRODUCTION }}

      # The faces come from the company profiles, which the daily cron reads only at 04:00 UTC, so every deploy reads them once.
      - name: Read the company profiles once
        run: pnpm exec convex run companyProfiles/sync:syncCompanyProfiles
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PRODUCTION }}

      # A shared emoji name added to the catalogue reaches every registry already in use at this deploy, not at the next company sync.
      - name: Reserve the shared emoji names in every registry in use
        run: pnpm exec convex run album/emojiNames:reserveSharedEmojiNames
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PRODUCTION }}

      - name: Backfill the pending-crate index once
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: pnpm exec convex run quests/pendingCrates:backfillPendingCrates
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PRODUCTION }}
