# A run started by hand deploys the chosen branch to the sandbox Convex deployment, which every lane shares.
# The deploy key is scoped to that one deployment and reaches only the deploy step.
name: Deploy sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running deploy, then the newest one wins.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  COHERENCE_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  COHERENCE_NO_UPDATE_CHECK: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - run: pnpm gate

      # A rerun of an older push must not roll the sandbox back past the branch's tip.
      - name: Check this push is still the branch's tip
        id: tip
        run: |
          tip=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "current=true"; else echo "current=false"; fi >> "$GITHUB_OUTPUT"

      - name: Deploy to the sandbox deployment
        if: steps.tip.outputs.current == 'true'
        run: pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_SANDBOX }}
